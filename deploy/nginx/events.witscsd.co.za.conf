# /etc/nginx/sites-available/events.witscsd.co.za
#
# Host-level nginx reverse proxy for the CSD platform. The Docker `web`
# container is published on 127.0.0.1:3000 only, so all public traffic must
# come through nginx.
#
# Enable with:
#   sudo ln -s /etc/nginx/sites-available/events.witscsd.co.za /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

# Redirect all plain HTTP to HTTPS. Keep the ACME path open for certbot.
server {
    listen 80;
    listen [::]:80;
    server_name events.witscsd.co.za;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name events.witscsd.co.za;

    ssl_certificate     /etc/letsencrypt/live/events.witscsd.co.za/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/events.witscsd.co.za/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Allow image / media uploads through the Next.js image optimizer + admin.
    client_max_body_size 25m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;

    # Content-hashed build assets are immutable — serve/keep them hot.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Optimized images. To cache these at nginx, add a cache zone to the http
    # block of /etc/nginx/nginx.conf:
    #   proxy_cache_path /var/cache/nginx/images levels=1:2 keys_zone=images:10m
    #                    max_size=1g inactive=7d use_temp_path=off;
    # then uncomment the proxy_cache lines below.
    location /_next/image {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        # proxy_cache images;
        # proxy_cache_valid 200 24h;
        # add_header X-Cache-Status $upstream_cache_status always;
    }

    # Everything else (SSR pages, RSC payloads, API routes).
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering on;
    }
}
